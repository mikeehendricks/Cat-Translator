<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Meow translator · admin</title>
<style>
/*__MEOW_DESIGN__*/

/* ---------------------------------------------------------------------------
   Admin layer. The panel's own vocabulary (cards, badges, tabs, stat figures)
   is expressed in terms of the shared design system so both pages look like the
   same product and inherit its light/dark and accessibility behaviour.
   ------------------------------------------------------------------------ */

body { background: var(--grouped); color: var(--label); min-height: 100vh; }
.wrap { max-width: 78rem; margin: 0 auto; padding: var(--space-4) var(--margin) var(--space-8); }
a { color: var(--tint); }
.spacer { flex: 1; }
.hide { display: none !important; }
.mono { font-family: var(--font-mono); font-size: .9em; }
.tiny, .tinies { font-size: var(--t-caption2); color: var(--label-2); }

/* Header: a chrome bar, with the version and who-you-are as badges. */
header.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--space-3);
  flex-wrap: wrap; margin: calc(-1 * var(--space-4)) calc(-1 * var(--margin)) var(--space-4);
  padding: var(--space-3) var(--margin);
  background: var(--chrome); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border-bottom: .5px solid var(--separator);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  header.top { background: var(--grouped); }
}
header.top h1 { margin: 0; font-size: var(--t-title3); letter-spacing: -.01em; }
header.top h1 span { color: var(--tint); }

/* Sign-in: one centred card, nothing else competing for attention. */
.center { min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: var(--margin); }
.auth { width: 100%; max-width: 27rem; padding: var(--space-5); }
.auth h1 { margin: 0; font-size: var(--t-title2); letter-spacing: -.015em; }
.auth h1 span { color: var(--tint); }
.catline { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }

/* Tabs read as one segmented control, as the platform does for a small,
   mutually exclusive set of panes. */
.tabs {
  display: flex; gap: .25rem; flex-wrap: wrap; margin: 0 0 var(--space-4);
  padding: .25rem; background: var(--fill-3); border-radius: var(--r-md);
}
.tabs button {
  flex: 1 1 auto; min-height: 2.25rem; border: none; background: transparent; color: var(--label);
  border-radius: calc(var(--r-md) - .125rem); padding: .4rem .75rem;
  font-size: var(--t-subhead); font-weight: 590; cursor: pointer;
}
.tabs button:hover { background: var(--fill-4); }
.tabs button.active { background: var(--grouped); color: var(--label); box-shadow: var(--shadow-1); }
.tabs button:focus-visible { outline: .1875rem solid var(--tint); outline-offset: .125rem; }
@media (max-width: 40rem) { .tabs { display: grid; grid-template-columns: repeat(2, 1fr); } }
@media (prefers-color-scheme: dark) { .tabs button.active { background: var(--fill-4); } }

/* Cards group related facts, as on the app page. */
.card {
  background: var(--grouped-2); border: .5px solid var(--separator); border-radius: var(--r-xl);
  padding: var(--space-4); margin-bottom: var(--space-3);
}
.card h2 {
  margin: 0 0 var(--space-3); font-size: var(--t-footnote); font-weight: 620; letter-spacing: .04em;
  text-transform: uppercase; color: var(--label-2);
}
.card h3 { margin: var(--space-4) 0 var(--space-2); font-size: var(--t-headline); }
.grid { display: grid; gap: var(--space-3); }
.g2 { grid-template-columns: 1fr; }
.g4 { grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); }
@media (min-width: 56rem) { .g2 { grid-template-columns: repeat(2, 1fr); } }
.split { display: grid; gap: var(--space-3); grid-template-columns: 1fr; }
@media (min-width: 56rem) { .split { grid-template-columns: 1.15fr .85fr; } }

/* Stat figures: one per fact, number first. */
.stat { background: var(--grouped-2); border: .5px solid var(--separator); border-radius: var(--r-md); padding: var(--space-3); }
.stat b { display: block; font-size: var(--t-title2); font-weight: 650; letter-spacing: -.02em; color: var(--label); }
.stat span { display: block; margin-top: .15rem; font-size: var(--t-caption1); color: var(--label-2); }

/* Tables: quiet rules, sticky header, figures aligned. */
table { width: 100%; border-collapse: collapse; font-size: var(--t-subhead); }
th, td { text-align: left; padding: .5rem .6rem; border-bottom: .5px solid var(--separator); vertical-align: top; }
th {
  position: sticky; top: 0; z-index: 1; background: var(--grouped-2); color: var(--label-2);
  font-size: var(--t-caption2); font-weight: 620; letter-spacing: .04em; text-transform: uppercase;
}
tbody tr:hover td { background: var(--fill-3); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td .mono { word-break: break-all; }

/* Controls: the panel's own class names, mapped onto the shared buttons. */
button { font: inherit; }
button:not(.btn):not(.segmented__item) {
  min-height: var(--hit); border-radius: var(--r-lg); border: none;
  background: var(--fill-3); color: var(--label); padding: .5rem .9rem; cursor: pointer;
  transition: background .15s ease, opacity .15s ease;
}
button:not(.btn):not(.segmented__item):hover { background: var(--fill-4); }
button:not(.btn):not(.segmented__item):focus-visible { outline: .1875rem solid var(--tint); outline-offset: .125rem; }
button.primary { background: var(--tint); color: var(--on-tint); font-weight: 600; }
button.primary:hover { background: var(--tint-press); }
button.ghost { background: transparent; color: var(--tint); }
button.ghost:hover { background: var(--fill-3); }
button.danger { background: var(--red-fill); color: var(--red); }
button.danger:hover { background: var(--red-fill-strong); }
button.small, button.smallish { min-height: 0; padding: .3rem .7rem; font-size: var(--t-caption1); border-radius: .5rem; }
button:disabled { opacity: .45; cursor: not-allowed; }

input, select, textarea {
  font: inherit; width: 100%; background: var(--grouped-2); color: var(--label);
  border: .5px solid var(--separator); border-radius: var(--r-md); padding: .6rem .7rem;
  font-size: var(--t-body); min-height: var(--hit);
}
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: .1875rem solid var(--tint); outline-offset: .0625rem; }
input[type=checkbox] { width: auto; min-height: 0; }
label { display: block; font-size: var(--t-footnote); color: var(--label-2); margin: var(--space-3) 0 .35rem; }
.row { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1; min-width: 9rem; }

/* Badges and figures: colour is never the only signal — each one carries a word. */
.badge { display: inline-flex; align-items: center; gap: .35rem; font-size: var(--t-caption1); padding: .15rem .5rem;
  border-radius: 999px; background: var(--fill-3); color: var(--label-2); white-space: nowrap; min-height: 1.5rem; }
.badge.ok { background: var(--green-fill); color: var(--green); }
.badge.warn { background: var(--orange-fill); color: var(--orange); }
.badge.bad { background: var(--red-fill); color: var(--red); }
.badge.violet, .badge.info { background: var(--tint-fill); color: var(--tint); }
.pill { font-size: var(--t-caption2); padding: .1rem .45rem; border-radius: 999px; background: var(--fill-3); color: var(--label-2); }
.pill.top { background: var(--tint-fill); color: var(--tint); }
.ok { color: var(--green); } .warn { color: var(--orange); } .bad { color: var(--red); }
.muted { color: var(--label-2); } .small { font-size: var(--t-subhead); }

pre.log {
  background: var(--fill-3); border: .5px solid var(--separator); border-radius: var(--r-md);
  padding: var(--space-3); max-height: 17.5rem; overflow: auto; margin: 0;
  font-family: var(--font-mono); font-size: var(--t-caption1); white-space: pre-wrap;
}
.bar { height: .5rem; border-radius: 999px; background: var(--fill-3); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--tint); }

/* Toasts: brief confirmations, bottom trailing, dismissable by time. */
.toast { position: fixed; right: var(--margin); bottom: var(--margin); z-index: 50; display: flex; flex-direction: column;
  gap: var(--space-2); align-items: flex-end; pointer-events: none; }
.toast div {
  background: var(--grouped-2); border: .5px solid var(--separator); border-left: .25rem solid var(--tint);
  border-radius: var(--r-md); padding: .6rem .8rem; font-size: var(--t-subhead); max-width: 26rem;
  box-shadow: var(--shadow-2); pointer-events: auto;
}
.toast div.err { border-left-color: var(--red); }
.toast div.good { border-left-color: var(--green); }

details summary { cursor: pointer; color: var(--label-2); font-size: var(--t-caption1); }
</style>
</head>
<body>
<!--__MEOW_SYMBOLS__-->
<div id="adminApp">

  <!-- ------------------------------------------------------------- sign in -->
  <div id="loginView" class="center">
    <div class="card auth">
      <div class="catline"><h1>Meow<span>.</span>admin</h1><span id="loginVersion" class="badge"></span></div>
      <p class="muted small" id="loginIntro">Loading…</p>

      <form id="registerForm" class="hide" autocomplete="off">
        <label for="regUser">Choose an admin username</label>
        <input id="regUser" name="username" autocomplete="username" placeholder="e.g. mike">
        <label for="regPass">Password (at least 10 characters, letters and numbers)</label>
        <input id="regPass" name="password" type="password" autocomplete="new-password">
        <label for="regPass2">Repeat password</label>
        <input id="regPass2" name="password2" type="password" autocomplete="new-password">
        <label for="regToken">One-time setup token</label>
        <input id="regToken" name="setupToken" placeholder="printed by the installer">
        <p class="tinies">On the server this is:<br><code class="mono">sudo meow-translator token</code></p>
        <div style="margin-top:14px"><button class="primary" type="submit" style="width:100%">Create the admin account</button></div>
      </form>

      <form id="loginForm" class="hide" autocomplete="off">
        <label for="logUser">Username</label>
        <input id="logUser" name="username" autocomplete="username">
        <label for="logPass">Password</label>
        <input id="logPass" name="password" type="password" autocomplete="current-password">
        <div style="margin-top:14px"><button class="primary" type="submit" style="width:100%">Sign in</button></div>
      </form>

      <p class="tinies" style="margin-top:14px">Registration can only be completed once; after that this page is a login page.
        Failed sign-ins are rate limited per IP address.</p>
    </div>
  </div>

  <!-- ---------------------------------------------------------------- panel -->
  <div id="panelView" class="wrap hide">
    <header class="top">
      <h1>Meow<span>.</span>admin</h1>
      <span id="appVersion" class="badge">version —</span>
      <span id="updateBadge" class="badge warn hide"></span>
      <span id="whoBadge" class="badge"></span>
      <div class="spacer"></div>
      <button id="viewSite" class="small ghost"><svg class="symbol" aria-hidden="true"><use href="#i-globe"/></svg>Open the app</button>
      <button id="logoutBtn" class="small"><svg class="symbol" aria-hidden="true"><use href="#i-lock"/></svg>Sign out</button>
    </header>

    <div class="tabs" id="tabs" role="tablist" aria-label="Admin sections">
      <button data-tab="overview" class="active" role="tab" aria-selected="true">Overview</button>
      <button data-tab="visits" role="tab" aria-selected="false">Visits</button>
      <button data-tab="updates" role="tab" aria-selected="false">Updates</button>
      <button data-tab="credentials" role="tab" aria-selected="false">Credentials</button>
      <button data-tab="settings" role="tab" aria-selected="false">Settings</button>
      <button data-tab="audit" role="tab" aria-selected="false">Audit log</button>
    </div>

    <section id="tab-overview"></section>
    <section id="tab-visits" class="hide"></section>
    <section id="tab-updates" class="hide"></section>
    <section id="tab-credentials" class="hide"></section>
    <section id="tab-settings" class="hide"></section>
    <section id="tab-audit" class="hide"></section>
  </div>

  <div class="toast" id="toasts"></div>
</div>

<script>
/* ------------------------------------------------------------------ helpers */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const esc = s => String(s === null || s === undefined ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const S = { csrf: null, username: null, app: null, instanceId: null, overview: null, visits: null, updates: null, settings: null, tab: 'overview', timer: null };

function toast(msg, kind) {
  const el = document.createElement('div');
  if (kind) el.className = kind;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), kind === 'err' ? 9000 : 4500);
}

async function api(path, opts) {
  opts = opts || {};
  const init = { method: opts.method || 'GET', credentials: 'same-origin', headers: {} };
  if (opts.body !== undefined) {
    init.headers['content-type'] = 'application/json';
    init.body = JSON.stringify(opts.body);
  }
  if (init.method !== 'GET' && S.csrf) init.headers['x-meow-csrf'] = S.csrf;
  const res = await fetch('/api/admin/' + path, init);
  let data = null;
  const text = await res.text();
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = { error: text.slice(0, 200) }; }
  if (res.status === 401) { showLogin(); throw new Error((data && data.error) || 'signed out'); }
  if (!res.ok) throw new Error((data && data.error) || ('request failed: ' + res.status));
  return data;
}

const fmtTime = t => t ? new Date(t).toLocaleString() : '—';
const fmtAgo = t => {
  if (!t) return '—';
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
};
const fmtBytes = n => {
  if (!n) return '0 B';
  const u = ['B', 'kB', 'MB', 'GB'];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return v.toFixed(v < 10 && i > 0 ? 1 : 0) + ' ' + u[i];
};
const fmtDur = sec => {
  sec = Math.round(sec || 0);
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  if (d) return d + 'd ' + h + 'h';
  if (h) return h + 'h ' + m + 'm';
  if (m) return m + 'm ' + (sec % 60) + 's';
  return sec + 's';
};

function sparkline(series, width, height) {
  if (!series || !series.length) return '';
  const max = Math.max(1, ...series.map(p => p.hits));
  const w = width || 640, h = height || 54, pad = 3;
  const step = series.length > 1 ? (w - pad * 2) / (series.length - 1) : 0;
  const pts = series.map((p, i) => [pad + i * step, h - pad - (p.hits / max) * (h - pad * 2)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${h - pad} L${pts[0][0].toFixed(1)} ${h - pad} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a04b" stop-opacity=".55"/><stop offset="1" stop-color="#9d7bff" stop-opacity=".05"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#sg)"/><path d="${line}" fill="none" stroke="#f0a04b" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>`;
}

function bars(list, color) {
  if (!list || !list.length) return '<p class="muted small">no data yet</p>';
  const max = Math.max(1, ...list.map(x => x.n));
  return list.map(x => `<div style="margin-bottom:7px">
      <div class="small" style="display:flex;justify-content:space-between;gap:10px">
        <span>${esc(x.key)}</span><span class="muted mono">${x.n}</span></div>
      <div class="bar"><i style="width:${(100 * x.n / max).toFixed(1)}%${color ? ';background:' + color : ''}"></i></div>
    </div>`).join('');
}

/* --------------------------------------------------------------------- auth */
function showLogin(mode) {
  $('#panelView').classList.add('hide');
  $('#loginView').classList.remove('hide');
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
  const registered = mode === 'login' || (mode !== 'register' && S.registered);
  $('#registerForm').classList.toggle('hide', registered);
  $('#loginForm').classList.toggle('hide', !registered);
  $('#loginIntro').textContent = registered
    ? 'Sign in to manage the translator: visits, credentials and updates.'
    : 'Welcome. There is no admin account yet — create the first one with the one-time setup token.';
  $('#regUser').focus();
  $('#logUser').focus();
}

async function boot() {
  try {
    const res = await fetch('/api/version', { credentials: 'same-origin' });
    const v = await res.json();
    S.app = v;
    S.instanceId = v.instanceId;
    $('#loginVersion').textContent = 'v' + v.version + (v.sha ? ' · ' + String(v.sha).slice(0, 8) : '');
  } catch (e) { /* offline is fine */ }

  try {
    const s = await api('session');
    enterPanel(s);
  } catch (e) {
    /* not signed in: decide between register and login */
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'content-type': 'application/json' }, body: '{}',
      });
      const data = await res.json();
      S.registered = !(res.status === 409 && /register/.test(data.error || ''));
      showLogin(S.registered ? 'login' : 'register');
    } catch (err) {
      S.registered = true;
      showLogin('login');
    }
  }
}

$('#registerForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const password = $('#regPass').value;
  if (password !== $('#regPass2').value) return toast('the two passwords do not match', 'err');
  try {
    const out = await api('register', {
      method: 'POST',
      body: { username: $('#regUser').value, password, setupToken: $('#regToken').value },
    });
    S.csrf = out.session.csrf;
    toast('admin account created', 'good');
    enterPanel({ session: out.session, admin: { username: $('#regUser').value }, app: S.app });
  } catch (e) { toast(e.message, 'err'); }
});

$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  try {
    const out = await api('login', { method: 'POST', body: { username: $('#logUser').value, password: $('#logPass').value } });
    S.csrf = out.session.csrf;
    enterPanel(out);
  } catch (e) { toast(e.message, 'err'); }
});

$('#logoutBtn').addEventListener('click', async () => {
  try { await api('logout', { method: 'POST' }); } catch (e) {}
  S.csrf = null;
  showLogin('login');
  toast('signed out');
});

function enterPanel(s) {
  S.csrf = (s.session && s.session.csrf) || S.csrf;
  S.username = (s.admin && s.admin.username) || (s.session && s.session.username);
  $('#loginView').classList.add('hide');
  $('#panelView').classList.remove('hide');
  $('#whoBadge').textContent = 'signed in as ' + S.username;
  if (S.timer) clearInterval(S.timer);
  S.timer = setInterval(() => { if (S.tab === 'overview' && !document.hidden) loadOverview(true); }, 20000);
  loadOverview();
}

/* ------------------------------------------------------------------- tabs */
$('#tabs').addEventListener('click', ev => {
  const btn = ev.target.closest('button[data-tab]');
  if (!btn) return;
  setTab(btn.dataset.tab);
});

function setTab(tab) {
  S.tab = tab;
  $$('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['overview', 'visits', 'updates', 'credentials', 'settings', 'audit'].forEach(t =>
    $('#tab-' + t).classList.toggle('hide', t !== tab));
  if (tab === 'overview') loadOverview();
  if (tab === 'visits') loadVisits();
  if (tab === 'updates') loadUpdates();
  if (tab === 'credentials') renderCredentials();
  if (tab === 'settings') loadSettings();
  if (tab === 'audit') loadAudit();
}

/* --------------------------------------------------------------- overview */
async function loadOverview(quiet) {
  let d;
  try { d = await api('overview'); } catch (e) { if (!quiet) toast(e.message, 'err'); return; }
  S.overview = d;
  S.app = d.app;
  const s = d.stats, t = s.totals, sv = d.server;

  $('#appVersion').textContent = 'v' + d.app.version + (d.app.sha ? ' · ' + d.app.sha.slice(0, 8) : '');
  const ub = $('#updateBadge');
  if (d.updateAvailable && d.latest) {
    ub.classList.remove('hide');
    ub.className = 'badge warn';
    ub.textContent = 'v' + d.latest.version + ' available';
    ub.onclick = () => setTab('updates');
    ub.style.cursor = 'pointer';
  } else if (d.latest) {
    ub.classList.remove('hide');
    ub.className = 'badge ok';
    ub.textContent = 'up to date';
  } else {
    ub.classList.add('hide');
  }

  $('#tab-overview').innerHTML = `
    <div class="grid g4" style="margin-bottom:14px">
      <div class="stat"><b>${t.today}</b><span>page views today</span></div>
      <div class="stat"><b>${t.uniquesToday}</b><span>visitors today</span></div>
      <div class="stat"><b>${t.inWindow}</b><span>views, last ${s.windowDays} days</span></div>
      <div class="stat"><b>${t.uniquesInWindow}</b><span>visitors, last ${s.windowDays} days</span></div>
      <div class="stat"><b>${t.distinctIps}</b><span>distinct IP addresses</span></div>
      <div class="stat"><b>${t.allTime}</b><span>views all time</span></div>
    </div>

    <div class="split">
      <div>
        <div class="card">
          <h2>Visits, last ${s.windowDays} days</h2>
          ${sparkline(s.series)}
          <div class="small muted" style="display:flex;justify-content:space-between;margin-top:6px">
            <span>${s.series[0] ? s.series[0].day : ''}</span>
            <span>peak ${Math.max(0, ...s.series.map(p => p.hits))}/day</span>
            <span>${s.series[s.series.length - 1] ? s.series[s.series.length - 1].day : ''}</span>
          </div>
          <h3>Top countries</h3>${bars(s.countries)}
          <h3>Top cities</h3>${bars(s.cities, 'linear-gradient(90deg,#6cb6ff,#9d7bff)')}
        </div>

        <div class="card">
          <h2>Recent visitors</h2>
          ${visitsTable(s.recent || [], true)}

function visitsTable(rows, compact) {
  if (!rows || !rows.length) return '<p class="muted small">No visits recorded yet. Open the app in another tab and reload it.</p>';
  const limit = compact ? 8 : rows.length;
  return `<table><thead><tr>
      <th>when</th><th>ip address</th><th>location</th>${compact ? '' : '<th>device</th><th>path</th><th>referrer</th>'}
      ${compact ? '' : '<th>browser</th>'}
    </tr></thead><tbody>
    ${rows.slice(0, limit).map(v => {
      const g = v.geo || null;
      const loc = g ? (g.local ? 'Local network' : [g.city, g.region, g.country].filter(Boolean).join(', ')) || '—'
                    : '<span class="muted tiny">looking up…</span>';
      /* Where the address came from. A proxy's address shown as the visitor's is
         the single most misleading thing a visit log can do, so the provenance
         is part of the row rather than a footnote. */
      const srcLabel = {
        socket: 'direct connection',
        reported: 'reported by the visitor’s browser',
        cloudflare: 'Cloudflare',
        'true-client-ip': 'True-Client-IP',
        'x-real-ip': 'X-Real-IP',
        'x-client-ip': 'X-Client-IP',
        'x-forwarded-for': 'X-Forwarded-For',
        forwarded: 'Forwarded',
        proxy: 'a proxy',
      }[v.source] || v.source || '';
      const flag = v.source === 'reported' ? '<span class="badge info">WAN</span> '
        : v.private ? '<span class="badge warn">private</span> '
        : '';
      const askState = v.reportState === 'asked' ? '<br><span class="tinies">asked the browser for its WAN address</span>'
        : v.reportState === 'rejected' ? `<br><span class="tinies">report refused: ${esc(v.reportNote || '')}</span>`
        : '';
      return `<tr>
        <td class="num" title="${esc(fmtTime(v.t))}">${fmtTime(v.t)}<br><span class="tinies">${fmtAgo(v.t)}</span></td>
        <td class="mono tiny">${flag}${esc(v.ip || (v.hash ? 'hidden (' + esc(v.hash.slice(0, 8)) + ')' : '—'))}${
          compact ? '' : `<br><span class="tinies">${esc(srcLabel)}${v.socketIp ? ` · saw ${esc(v.socketIp)} first` : ''}</span>${askState}`}</td>
        <td class="small">${loc}${g && g.isp ? `<br><span class="tinies">${esc(g.isp)}</span>` : ''}</td>
        ${compact ? '' : `<td class="small">${esc(v.device)}</td>
        <td class="small mono">${esc(v.path)}</td>
        <td class="small">${esc(v.ref ? (() => { try { return new URL(v.ref).host; } catch (e) { return v.ref; } })() : '(direct)')}</td>
        <td class="small">${esc(browserName(v.ua))}</td>`}
      </tr>`;
    }).join('')}
  </tbody></table>`;
}

function browserName(ua) {
  const s = ua || '';
  if (/(bot|crawler|spider|curl|wget|python-requests|headless)/i.test(s)) return 'bot';
  if (/Edg\//.test(s)) return 'Edge';
  if (/OPR\/|Opera/.test(s)) return 'Opera';
  if (/Firefox\//.test(s)) return 'Firefox';
  if (/Chrome\//.test(s)) return 'Chrome';
  if (/Safari\//.test(s)) return 'Safari';
  return 'other';
}

/* ------------------------------------------------------------------- visits */
async function loadVisits(filter) {
  const f = filter || S.visitFilter || {};

  const qs = new URLSearchParams();

  if (f.country) qs.set('country', f.country);

  qs.set('bots', f.bots ? '1' : '0');
  qs.set('limit', '200');
  let d;
  try { d = await api('visits?' + qs.toString()); } catch (e) { return toast(e.message, 'err'); }
  S.visits = d;
  const s = d.summary, t = s.totals;

  /* An empty table is not the same as no traffic. The filter above hides bot
     traffic by default and the summary counts everything, so when the two
     disagree say why — and offer the one tap that shows them. */
  const filtering = !!(f.day || f.country || f.q || f.ip);

    <div class="card">

      <div>
        <div class="card"><h2>Devices</h2>${bars(s.devices)}<h2 style="margin-top:14px">Browsers</h2>${bars(s.browsers)}</div>

function renderRemote(c) {
  const box = $('#remoteCard');
  if (!box) return;
  if (!c) {
    box.innerHTML = '<h2>Update source</h2><p class="small muted">Not checked yet — press “check for updates”.</p>';
    return;
  }
  if (c.error) {
    box.innerHTML = `<h2>Update source</h2><p class="small bad">${esc(c.error)}</p>
      <p class="tinies muted">If the repository is private, add a token in Settings.</p>`;
    return;
  }
  const r = c.remote || {};
  const same = c.sameSha;
  const newer = c.newer;
  const publish = c.publish;
  const headline = same ? '<span class="badge ok">this exact commit is running</span>'
    : newer ? `<span class="badge warn">update available</span>`
    : publish ? '<span class="badge warn">the remote republished this version</span>'
    : `<span class="badge">the remote is older than what is installed</span>`;
  box.innerHTML = `
    <h2>Update source · ${esc(c.repo)}@${esc(c.branch)}</h2>
    <div class="catline" style="margin-bottom:8px">
      <span class="badge violet" style="font-size:15px;padding:6px 12px">v${esc(r.version)}</span>
      <span class="badge mono">${esc(r.shortSha || '')}</span>
      ${headline}
    </div>
    <table>
      <tr><td class="muted">commit</td><td class="mono tiny">${esc(r.sha || '')}</td></tr>
      <tr><td class="muted">message</td><td class="small">${esc(r.message || '—')}</td></tr>
      <tr><td class="muted">committed</td><td>${fmtTime(r.date ? Date.parse(r.date) : null)}</td></tr>
      <tr><td class="muted">checked</td><td>${fmtAgo(c.checkedAt)}</td></tr>
    </table>
    <div class="row" style="margin-top:12px">
      ${(newer || publish) ? `<button class="primary" id="upInstall">install v${esc(r.version)}</button>` : ''}
      ${r.url ? `<button class="ghost" onclick="window.open('${esc(r.url)}','_blank')">view commit ↗</button>` : ''}
    </div>
    ${(newer || publish) ? '<p class="tinies">The staged copy is smoke-tested before anything is replaced, and the current version is snapshotted for rollback.</p>'
      : '<p class="tinies muted">Installing the same version again is possible from the history below if you need to redeploy.</p>'}`;

  const inst = $('#upInstall');
  if (inst) inst.onclick = async () => {
    if (!confirm(`Install v${r.version} (${r.shortSha}) and restart?`)) return;
    inst.disabled = true;
    inst.textContent = 'installing…';

      const out = await api('updates/install', { method: 'POST', body: { sha: r.sha, version: r.version } });
      if (!out.changed) { toast(out.message || 'nothing to do'); loadUpdates(); return; }
      toast(`installed v${out.version} in ${out.elapsedMs} ms`, 'good');

      toast('install failed: ' + e.message, 'err');
      inst.disabled = false;
      inst.textContent = 'install v' + r.version;
      loadUpdates();
    }
  };
}

async function waitForRestart(expectVersion) {
  toast('the service is restarting…');
  const started = Date.now();
  /* The process that is on its way out keeps answering for another second or
     two, and a fresh process reports an uptime of 0 — so identity, not time, is
     what tells us the new one is up. */
  while (Date.now() - started < 90000) {
    await new Promise(r => setTimeout(r, 1000));
    try {
      const res = await fetch('/api/health', { cache: 'no-store', credentials: 'same-origin' });
      if (!res.ok) continue;
      const h = await res.json();
      const fresh = S.instanceId ? h.instanceId && h.instanceId !== S.instanceId
                                 : h.uptimeSec < (Date.now() - started) / 1000 + 5;
      if (fresh) {
        toast(`back online · running v${h.version}`, 'good');
        setTimeout(() => location.reload(), 900);
        return;
      }
    } catch (e) { /* still down, keep waiting */ }
  }
  toast('the service did not come back within 90s — check "systemctl status meow-translator"', 'err');
}

        </form>
      </div>
      <div class="card">
        <h2>Account</h2>
        <table>
          <tr><td class="muted">Username</td><td>${esc(S.username || '—')}</td></tr>
          <tr><td class="muted">Account created</td><td>${S.overview && S.overview.sessions ? '' : ''}${fmtTime(window.__createdAt || null)}</td></tr>
          <tr><td class="muted">Password hashing</td><td class="mono tiny">scrypt (N=16384, r=8, p=1)</td></tr>
          <tr><td class="muted">Session lifetime</td><td>12 hours, sliding</td></tr>
        </table>
        <p class="tinies">Registration is closed permanently once an account exists. If you lose the password, reset it on the
          server with <span class="mono">sudo meow-translator reset-password</span>.</p>
      </div>
    </div>`;

  $('#credForm').onsubmit = async ev => {
    ev.preventDefault();
    const np = $('#cNew').value;
    if (np && np !== $('#cNew2').value) return toast('the two new passwords do not match', 'err');
    try {
      const out = await api('credentials', {
        method: 'POST',
        body: { username: $('#cUser').value, currentPassword: $('#cCur').value, newPassword: np || undefined },
      });
      S.username = out.username;
      $('#whoBadge').textContent = 'signed in as ' + out.username;
      toast('updated ' + out.changed.join(' and '), 'good');
      loadOverview(true);
    } catch (e) { toast(e.message, 'err'); }
  };
  $('#signOutAll').onclick = async () => {
    if (!confirm('Sign out every session, including this one?')) return;
    try { await api('logout-all', { method: 'POST' }); showLogin('login'); } catch (e) { toast(e.message, 'err'); }
  };
  api('session').then(s => {
    window.__createdAt = s.admin.createdAt;
    setTab('credentials');
  }).catch(() => {});
}

/* ----------------------------------------------------------------- settings */
async function loadSettings() {
  let d;
  try { d = await api('overview'); } catch (e) { return toast(e.message, 'err'); }
  const s = d.settings;
  const sv = d.server || {};
  S.settings = s;
  $('#tab-settings').innerHTML = `
    <div class="split">
      <div class="card">
        <h2>Visits &amp; privacy</h2>
        <form id="setForm" autocomplete="off">
          <label>Visitor IP addresses</label>
          <select id="sRawIp">
            <option value="1"${s.storeRawIp ? ' selected' : ''}>store the address (shows the IP column)</option>
            <option value="0"${!s.storeRawIp ? ' selected' : ''}>store a salted hash only (privacy mode)</option>
          </select>
          <label>Location lookups</label>
          <select id="sGeo">
            <option value="1"${s.geoLookup ? ' selected' : ''}>on — resolve country/city from a public IP service</option>
            <option value="0"${!s.geoLookup ? ' selected' : ''}>off — keep every address on this server</option>
          </select>
          <label>Addresses from a proxy in front</label>
          <select id="sTrust">
            <option value="auto"${s.trustProxy === 'auto' ? ' selected' : ''}>auto — believe the headers only from this machine or the LAN (recommended)</option>
            <option value="1"${s.trustProxy === true ? ' selected' : ''}>on — believe them from anywhere (nginx/Cloudflare you control)</option>
            <option value="0"${s.trustProxy === false ? ' selected' : ''}>off — ignore them, log the address that connects</option>
          </select>
          <p class="tinies" style="margin:6px 0 0">
            The config file (<span class="mono">${esc(sv.configPath || '/etc/meow-translator/config.json')}</span>) sets the
            installed default; a choice made here is kept with the rest of the settings in the data directory, which is
            the part of the installation this service can write to. It takes effect immediately and survives a restart.
          </p>
          <label>Visitor&rsquo;s own (WAN) address</label>
          <select id="sReportIp">
            <option value="1"${s.reportVisitorIp !== false ? ' selected' : ''}>on — ask the visitor&rsquo;s browser, when this server cannot see a public address</option>
            <option value="0"${s.reportVisitorIp === false ? ' selected' : ''}>off — log only what arrives at this server</option>
          </select>
          <p class="tinies" style="margin:6px 0 0">
            Behind a router, a container network or a proxy that rewrites addresses, the address this server
            receives belongs to the middlebox — <span class="mono">172.17.x.x</span>,
            <span class="mono">169.254.x.x</span>, <span class="mono">192.168.x.x</span>. Nothing the server can
            read recovers the visitor&rsquo;s own address, so when this is on and the address looks private, the
            page asks the browser to look up the address the world sees it from
            (<span class="mono">${esc((s.publicIpEndpoints && s.publicIpEndpoints.length ? s.publicIpEndpoints : ['https://ipwho.is/']).join(' '))}</span>)
            and reports it back for that one visit. It is a third-party request made by the visitor&rsquo;s
            browser, it happens once per page view, and it is off for every visitor when the address setting
            above is privacy mode. Leave it off and the log will honestly say &ldquo;private&rdquo; instead.
          </p>
          <label for="sRetention">Keep visits for (days)</label>
          <input id="sRetention" type="number" min="1" max="3650" value="${s.retentionDays}">

          <h3>Updates</h3>
          <label>Automatic checks</label>
          <select id="sAutoCheck">
            <option value="1"${s.autoCheckUpdates ? ' selected' : ''}>every 6 hours</option>
            <option value="0"${!s.autoCheckUpdates ? ' selected' : ''}>never (manual only)</option>
          </select>
          <label>Automatic install</label>
          <select id="sAutoInstall">
            <option value="0"${!s.autoInstallUpdates ? ' selected' : ''}>off — I will press install</option>
            <option value="1"${s.autoInstallUpdates ? ' selected' : ''}>on — install new versions automatically</option>
          </select>
          <label for="sRepo">GitHub repository (owner/name)</label>
          <input id="sRepo" value="${esc(s.githubRepo)}">
          <label for="sChannel">Branch to follow</label>
          <input id="sChannel" value="${esc(s.updateChannel)}">
          <label for="sToken">GitHub token <span class="tinies">(only needed for a private fork; leave blank otherwise)</span></label>
          <input id="sToken" type="password" placeholder="${s.githubToken ? '*** (set)' : 'not set'}">

          <div class="row" style="margin-top:14px"><button class="primary" type="submit">save settings</button></div>
        </form>
      </div>
      <div class="card">
        <h2>What these do</h2>
        <p class="small muted"><b>Privacy mode</b> keeps the statistics useful (unique visitors, returning visitors, daily
          counts) while storing no address: the IP is replaced by a salted SHA-256 hash of address + user agent.</p>
        <p class="small muted"><b>Location lookups</b> send the visitor's address to a public service (ipwho.is, falling back to
          ip-api.com) and cache the answer for a month. Turn it off if the server must not talk to anyone.</p>
        <p class="small muted"><b>Automatic install</b> is off by default on purpose. When it is on, a newer version in the
          repository is installed and the service restarts within minutes — the staged copy is still smoke-tested first,
          and the previous version is snapshotted for rollback.</p>
        <p class="small muted"><b>Token</b> is only for private forks or when GitHub's unauthenticated rate limit gets in the
          way. It is stored in the store file on the server (mode 600) and never sent to the browser.</p>
        <div class="card" style="margin-top:14px;background:#191527">
          <h2>Maintenance</h2>
          <p class="small muted">On the server:</p>
          <pre class="log">systemctl status meow-translator
journalctl -u meow-translator -f
sudo meow-translator update      # update from the command line
sudo meow-translator rollback    # roll back one version
sudo meow-translator token       # re-print the one-time setup token
sudo meow-translator backup      # snapshot the data directory</pre>
        </div>
      </div>
    </div>`;

  $('#setForm').onsubmit = async ev => {
    ev.preventDefault();
    try {
      const out = await api('settings', {
        method: 'POST',
        body: {
          storeRawIp: $('#sRawIp').value === '1',
          geoLookup: $('#sGeo').value === '1',
          reportVisitorIp: $('#sReportIp').value === '1',
          trustProxy: $('#sTrust').value,
          retentionDays: Number($('#sRetention').value),
          autoCheckUpdates: $('#sAutoCheck').value === '1',
          autoInstallUpdates: $('#sAutoInstall').value === '1',
          githubRepo: $('#sRepo').value,
          updateChannel: $('#sChannel').value,
          githubToken: $('#sToken').value || undefined,
        },
      });
      S.settings = out.settings;
      toast('settings saved', 'good');
      loadSettings();
    } catch (e) { toast(e.message, 'err'); }
  };
}

/* --------------------------------------------------------------------- audit */
async function loadAudit() {
  let d;
  try { d = await api('audit'); } catch (e) { return toast(e.message, 'err'); }
  $('#tab-audit').innerHTML = `
    <div class="card">
      <h2>Admin activity</h2>
      <table><thead><tr><th>when</th><th>who</th><th>action</th><th>detail</th><th>ip</th></tr></thead><tbody>
        ${(d.rows || []).map(r => `<tr>
          <td class="num tiny">${fmtTime(r.t)}</td>
          <td class="small">${esc(r.who)}</td>
          <td class="small"><span class="pill">${esc(r.action)}</span></td>
          <td class="small">${esc(r.detail)}</td>
          <td class="mono tiny">${esc(r.ip)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted small">nothing yet</td></tr>'}
      </tbody></table>
    </div>`;
}

/* -------------------------------------------------------------------- start */
$('#viewSite').onclick = () => window.open('/', '_blank');
boot();
</script>
</body>
</html>
